<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpamShield AI — Email Classifier</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-green: #00ff88;
    --neon-red: #ff3366;
    --neon-blue: #00d4ff;
    --neon-yellow: #ffcc00;
    --bg-dark: #050a0f;
    --bg-card: #0a1520;
    --bg-panel: #0d1b2a;
    --border-glow: rgba(0, 212, 255, 0.3);
    --text-primary: #e0f4ff;
    --text-dim: #4a7a9b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-dark);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── Animated Grid Background ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridScroll 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes gridScroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(50px); }
  }

  /* ─── Floating Particles ─── */
  .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: var(--neon-blue);
    border-radius: 50%;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  /* ─── Header ─── */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 50px 20px 30px;
  }

  .logo-wrapper {
    display: inline-block;
    position: relative;
  }

  .logo-ring {
    position: absolute;
    inset: -20px;
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 50%;
    animation: spin 8s linear infinite;
  }
  .logo-ring::before {
    content: '';
    position: absolute;
    top: -3px; left: 50%;
    width: 6px; height: 6px;
    background: var(--neon-blue);
    border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 15px var(--neon-blue);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .shield-icon {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #0d2a3f, #1a4060);
    border: 2px solid var(--neon-blue);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 30px rgba(0,212,255,0.4), inset 0 0 20px rgba(0,212,255,0.1);
    animation: shieldPulse 3s ease-in-out infinite;
    margin: 0 auto 20px;
    position: relative;
    z-index: 1;
  }

  @keyframes shieldPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(0,212,255,0.4), inset 0 0 20px rgba(0,212,255,0.1); }
    50% { box-shadow: 0 0 60px rgba(0,212,255,0.8), inset 0 0 40px rgba(0,212,255,0.2); }
  }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--neon-blue), #fff, var(--neon-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    animation: titleShimmer 4s ease-in-out infinite;
  }

  @keyframes titleShimmer {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .subtitle {
    font-family: 'Share Tech Mono', monospace;
    color: var(--neon-blue);
    font-size: 13px;
    letter-spacing: 6px;
    margin-top: 8px;
    opacity: 0.7;
  }

  /* ─── Stats Bar ─── */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin: 0 auto 30px;
    max-width: 800px;
    padding: 0 20px;
    position: relative; z-index: 10;
  }

  .stat-item {
    text-align: center;
    background: var(--bg-card);
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: 10px;
    padding: 12px 24px;
    min-width: 120px;
    position: relative;
    overflow: hidden;
  }

  .stat-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
    animation: scanLine 3s ease-in-out infinite;
  }

  @keyframes scanLine {
    0%, 100% { opacity: 0; transform: translateX(-100%); }
    50% { opacity: 1; transform: translateX(100%); }
  }

  .stat-value {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--neon-green);
  }

  .stat-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* ─── Main Container ─── */
  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 60px;
    position: relative; z-index: 10;
  }

  /* ─── Input Panel ─── */
  .input-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,212,255,0.05), inset 0 1px 0 rgba(0,212,255,0.1);
  }

  .input-panel::before {
    content: '';
    position: absolute;
    top: -1px; left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
  }

  .corner {
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--neon-blue);
    border-style: solid;
    opacity: 0.6;
  }
  .corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

  .panel-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--neon-blue);
    text-transform: uppercase;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .panel-label::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--neon-blue);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--neon-blue);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 15px;
  }

  @media (max-width: 600px) { .input-row { grid-template-columns: 1fr; } }

  .field-group label {
    display: block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  input[type="text"], textarea {
    width: 100%;
    background: rgba(0,10,20,0.6);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    padding: 12px 16px;
    outline: none;
    transition: all 0.3s ease;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--neon-blue);
    box-shadow: 0 0 20px rgba(0,212,255,0.2), inset 0 0 10px rgba(0,212,255,0.05);
  }

  textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  /* ─── Buttons ─── */
  .btn-row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 14px 32px;
    border-radius: 8px;
    border: none;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, #003d6b, #005fa3);
    border: 1px solid var(--neon-blue);
    color: var(--neon-blue);
    flex: 1;
    min-width: 180px;
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, #005fa3, #0080d4);
    box-shadow: 0 0 30px rgba(0,212,255,0.5);
    transform: translateY(-2px);
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
  }

  .btn-primary:hover::after { transform: translateX(100%); }

  .btn-clear {
    background: transparent;
    border: 1px solid rgba(255,51,102,0.3);
    color: rgba(255,51,102,0.7);
    padding: 14px 24px;
  }

  .btn-clear:hover {
    border-color: var(--neon-red);
    color: var(--neon-red);
    box-shadow: 0 0 20px rgba(255,51,102,0.3);
  }

  .btn-sample {
    background: transparent;
    border: 1px solid rgba(255,204,0,0.3);
    color: rgba(255,204,0,0.7);
    padding: 14px 24px;
    font-size: 11px;
  }

  .btn-sample:hover {
    border-color: var(--neon-yellow);
    color: var(--neon-yellow);
    box-shadow: 0 0 20px rgba(255,204,0,0.3);
  }

  /* ─── Result Panel ─── */
  .result-panel {
    display: none;
    background: var(--bg-panel);
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .result-panel.spam {
    border: 1px solid rgba(255,51,102,0.5);
    box-shadow: 0 0 40px rgba(255,51,102,0.1);
  }

  .result-panel.ham {
    border: 1px solid rgba(0,255,136,0.5);
    box-shadow: 0 0 40px rgba(0,255,136,0.1);
  }

  .result-panel.spam::before {
    content: '';
    position: absolute;
    top: -1px; left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-red), transparent);
  }

  .result-panel.ham::before {
    content: '';
    position: absolute;
    top: -1px; left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
  }

  /* ─── Verdict Display ─── */
  .verdict-wrapper {
    display: flex;
    align-items: center;
    gap: 25px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }

  .verdict-icon {
    width: 90px; height: 90px;
    border-radius: 20px;
    display: flex;
    align-items: center; justify-content: center;
    font-size: 44px;
    flex-shrink: 0;
    position: relative;
    animation: iconBounce 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes iconBounce {
    0% { transform: scale(0) rotate(-20deg); }
    70% { transform: scale(1.15) rotate(5deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .verdict-icon.spam-icon {
    background: linear-gradient(135deg, #2a0010, #4a0020);
    border: 2px solid var(--neon-red);
    box-shadow: 0 0 30px rgba(255,51,102,0.4);
  }

  .verdict-icon.ham-icon {
    background: linear-gradient(135deg, #00200f, #004020);
    border: 2px solid var(--neon-green);
    box-shadow: 0 0 30px rgba(0,255,136,0.4);
  }

  .verdict-text h2 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1.1;
  }

  .verdict-text h2.spam-label { color: var(--neon-red); text-shadow: 0 0 20px rgba(255,51,102,0.5); }
  .verdict-text h2.ham-label { color: var(--neon-green); text-shadow: 0 0 20px rgba(0,255,136,0.5); }

  .verdict-text p {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* ─── Confidence Bar ─── */
  .confidence-section { margin-bottom: 20px; }

  .conf-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .conf-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .conf-value {
    font-family: 'Orbitron', monospace;
    font-size: 20px;
    font-weight: 700;
  }

  .conf-value.spam { color: var(--neon-red); }
  .conf-value.ham { color: var(--neon-green); }

  .bar-track {
    height: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .bar-fill {
    height: 100%;
    border-radius: 999px;
    width: 0;
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }

  .bar-fill::after {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 20px;
    background: rgba(255,255,255,0.4);
    border-radius: 999px;
    filter: blur(4px);
  }

  .bar-fill.spam { background: linear-gradient(90deg, #660020, var(--neon-red)); }
  .bar-fill.ham { background: linear-gradient(90deg, #003020, var(--neon-green)); }

  /* ─── Features Grid ─── */
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .feature-card {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px;
    position: relative;
    overflow: hidden;
    animation: featureAppear 0.4s ease both;
  }

  .feature-card:nth-child(1) { animation-delay: 0.1s; }
  .feature-card:nth-child(2) { animation-delay: 0.2s; }
  .feature-card:nth-child(3) { animation-delay: 0.3s; }
  .feature-card:nth-child(4) { animation-delay: 0.4s; }

  @keyframes featureAppear {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .feature-name {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .feature-val {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--neon-blue);
  }

  .feature-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ─── Keywords Section ─── */
  .keywords-section { margin-bottom: 15px; }

  .kw-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .kw-tag {
    padding: 4px 12px;
    border-radius: 4px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    animation: tagPop 0.3s ease both;
  }

  @keyframes tagPop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  .kw-tag.danger {
    background: rgba(255,51,102,0.15);
    border: 1px solid rgba(255,51,102,0.4);
    color: var(--neon-red);
  }

  .kw-tag.safe {
    background: rgba(0,255,136,0.1);
    border: 1px solid rgba(0,255,136,0.3);
    color: var(--neon-green);
  }

  .kw-tag.neutral {
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.2);
    color: var(--neon-blue);
  }

  /* ─── History Log ─── */
  .history-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 25px;
    position: relative;
    overflow: hidden;
  }

  .history-panel .corner { opacity: 0.3; }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .history-title {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--neon-blue);
  }

  .history-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .history-list { display: flex; flex-direction: column; gap: 10px; }

  .history-item {
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 12px 16px;
    animation: historySlide 0.3s ease;
  }

  @keyframes historySlide {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .history-badge {
    padding: 3px 10px;
    border-radius: 4px;
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .history-badge.spam {
    background: rgba(255,51,102,0.15);
    border: 1px solid rgba(255,51,102,0.4);
    color: var(--neon-red);
  }

  .history-badge.ham {
    background: rgba(0,255,136,0.1);
    border: 1px solid rgba(0,255,136,0.3);
    color: var(--neon-green);
  }

  .history-subject {
    flex: 1;
    font-size: 13px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-conf {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .empty-history {
    text-align: center;
    padding: 30px;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
  }

  /* ─── Loading Overlay ─── */
  .loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,10,15,0.9);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }

  .loading.active { display: flex; }

  .scanner {
    width: 120px; height: 120px;
    position: relative;
  }

  .scanner-ring {
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    border-top-color: var(--neon-blue);
    border-radius: 50%;
    animation: scanSpin 1s linear infinite;
  }

  .scanner-ring:nth-child(2) {
    inset: 15px;
    border-top-color: var(--neon-green);
    animation-duration: 0.8s;
    animation-direction: reverse;
  }

  .scanner-ring:nth-child(3) {
    inset: 30px;
    border-top-color: var(--neon-yellow);
    animation-duration: 1.2s;
  }

  .scanner-center {
    position: absolute;
    inset: 45px;
    background: radial-gradient(circle, var(--neon-blue), transparent);
    border-radius: 50%;
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes scanSpin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .loading-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--neon-blue);
    text-transform: uppercase;
    animation: textBlink 1s ease-in-out infinite;
  }

  @keyframes textBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ─── Scan Line Effect ─── */
  .scan-line {
    position: fixed;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
    top: -2px;
    animation: scanDown 4s linear infinite;
    z-index: 1;
    pointer-events: none;
  }

  @keyframes scanDown {
    0% { top: -2px; }
    100% { top: 100vh; }
  }

  /* ─── Responsive ─── */
  @media (max-width: 500px) {
    .input-panel, .result-panel, .history-panel { padding: 18px; }
    .btn { font-size: 10px; padding: 12px 18px; }
  }
</style>
</head>
<body>

<div class="scan-line"></div>

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- Loading Overlay -->
<div class="loading" id="loading">
  <div class="scanner">
    <div class="scanner-ring"></div>
    <div class="scanner-ring"></div>
    <div class="scanner-ring"></div>
    <div class="scanner-center"></div>
  </div>
  <div class="loading-text" id="loadingText">ANALYZING EMAIL...</div>
</div>

<!-- Header -->
<header>
  <div class="logo-wrapper">
    <div class="logo-ring"></div>
    <div class="shield-icon">🛡️</div>
  </div>
  <h1>SPAMSHIELD AI</h1>
  <div class="subtitle">// INTELLIGENT EMAIL THREAT DETECTION SYSTEM //</div>
</header>

<!-- Stats Bar -->
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-value" id="totalScanned">0</div>
    <div class="stat-label">Scanned</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" style="color:var(--neon-red)" id="spamCount">0</div>
    <div class="stat-label">Spam Found</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" style="color:var(--neon-green)" id="hamCount">0</div>
    <div class="stat-label">Legit Emails</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="accuracyVal">—</div>
    <div class="stat-label">Accuracy</div>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Input Panel -->
  <div class="input-panel">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="panel-label">EMAIL INPUT TERMINAL</div>

    <form id="emailForm">
    <div class="input-row">
      <div class="field-group">
        <label>FROM (Sender Address)</label>
        <input type="text" id="sender" name="sender" placeholder="sender@example.com">
      </div>
      <div class="field-group">
        <label>SUBJECT LINE</label>
        <input type="text" id="subject" name="subject" placeholder="Enter email subject...">
      </div>
    </div>

    <div class="panel-label" style="margin-top:5px;">EMAIL BODY</div>
    <textarea id="emailBody" name="message" placeholder="Paste email content here for analysis...&#10;&#10;Example: Congratulations! You have won $1,000,000. Click here to claim your prize now!"></textarea>

    <div class="btn-row">
      <button class="btn btn-primary" type="button" onclick="classifyEmail()">⚡ ANALYZE EMAIL</button>
      <button type="button" class="btn btn-sample" onclick="loadSample('spam')">🔴 LOAD SPAM SAMPLE</button>
      <button type="button" class="btn btn-sample" onclick="loadSample('ham')">🟢 LOAD LEGIT SAMPLE</button>
      <button type="button" class="btn btn-clear" onclick="clearAll()">✕ CLEAR</button>
    </div>
    </form>
  </div>

  <!-- Result Panel -->
  <div class="result-panel" id="resultPanel">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="verdict-wrapper">
      <div class="verdict-icon" id="verdictIcon"></div>
      <div class="verdict-text">
        <h2 id="verdictLabel"></h2>
        <p id="verdictDesc"></p>
      </div>
    </div>

    <div class="confidence-section">
      <div class="conf-header">
        <span class="conf-label">THREAT CONFIDENCE</span>
        <span class="conf-value" id="confValue"></span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="confBar"></div>
      </div>
    </div>

    <div class="features-grid" id="featuresGrid"></div>

    <div class="keywords-section" id="keywordsSection">
      <div class="kw-label">DETECTED SIGNALS</div>
      <div class="keywords" id="keywordsList"></div>
    </div>
  </div>

  <!-- History -->
  <div class="history-panel">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="history-header">
      <span class="history-title">SCAN LOG</span>
      <span class="history-count" id="histCount">0 RECORDS</span>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-history">[ NO SCANS YET — SUBMIT AN EMAIL TO BEGIN ]</div>
    </div>
  </div>

</div>

<script>
// ─── Particles ───
const container = document.getElementById('particles');
for (let i = 0; i < 50; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random() * 100}%;
    animation-duration: ${5 + Math.random() * 15}s;
    animation-delay: ${Math.random() * 10}s;
    width: ${1 + Math.random() * 3}px;
    height: ${1 + Math.random() * 3}px;
    background: ${['#00d4ff','#00ff88','#ff3366','#ffcc00'][Math.floor(Math.random()*4)]};
  `;
  container.appendChild(p);
}

// ─── Spam Dataset ───
const SPAM_KEYWORDS = [
  'free', 'winner', 'won', 'prize', 'lottery', 'claim', 'urgent', 'act now',
  'limited time', 'offer', 'click here', 'million', 'cash', '$$$', 'earn money',
  'make money', 'credit', 'debt', 'loan', 'guaranteed', 'no risk', 'hot deal',
  'amazing', 'incredible', 'congratulations', 'selected', 'lucky', 'reward',
  'bonus', 'investment', 'profit', '100%', 'buy now', 'order now', 'subscribe',
  'unsubscribe', 'dear friend', 'dear customer', 'nigerian', 'inheritance',
  'bank account', 'transfer', 'verify', 'account suspended', 'password', 'login',
  'click', 'link', 'deal', 'discount', 'sale', 'cheap', 'lowest price'
];

const HAM_KEYWORDS = [
  'meeting', 'schedule', 'report', 'project', 'team', 'update', 'review',
  'attached', 'document', 'please', 'regards', 'sincerely', 'thanks',
  'follow up', 'agenda', 'conference', 'presentation', 'deadline', 'status',
  'invoice', 'receipt', 'order', 'shipping', 'delivery', 'tracking'
];

const SPAM_PATTERNS = [
  { regex: /\$[\d,]+/, label: 'MONEY AMOUNT', weight: 3 },
  { regex: /\d+%\s*(off|discount|free)/i, label: 'DISCOUNT OFFER', weight: 2 },
  { regex: /click\s+here/i, label: 'CLICK HERE', weight: 3 },
  { regex: /http[s]?:\/\//i, label: 'URL DETECTED', weight: 1 },
  { regex: /dear\s+(friend|customer|user)/i, label: 'GENERIC GREETING', weight: 2 },
  { regex: /\b(won|winner|winning)\b/i, label: 'WINNER CLAIM', weight: 4 },
  { regex: /\bfree\b/i, label: 'FREE OFFER', weight: 2 },
  { regex: /act\s+now|limited\s+time/i, label: 'URGENCY TRIGGER', weight: 3 },
  { regex: /guaranteed/i, label: 'GUARANTEE CLAIM', weight: 2 },
  { regex: /[A-Z]{5,}/, label: 'EXCESSIVE CAPS', weight: 1 },
  { regex: /!{2,}/, label: 'MULTIPLE EXCLAMATION', weight: 1 },
  { regex: /\b(million|billion)\b/i, label: 'LARGE SUM CLAIM', weight: 3 },
];

const history = [];
let stats = { scanned: 0, spam: 0, ham: 0 };

// ─── Samples ───
const samples = {
  spam: {
    sender: 'noreply@freeprizes-international.net',
    subject: 'CONGRATULATIONS!! You Have WON $1,000,000 - CLAIM NOW!!!',
    body: `Dear Friend,

CONGRATULATIONS!!! You have been SELECTED as our LUCKY WINNER of this month's mega lottery!

You have WON $1,000,000 USD (One Million Dollars)!

To CLAIM YOUR FREE PRIZE immediately, click here: http://claim-prize-now.suspicious.net

This is a LIMITED TIME OFFER - act NOW before it expires in 24 hours!

100% GUARANTEED - No Risk! Amazing deal for you ONLY!

Please provide your bank account details to transfer the money.

Sincerely,
Mr. Johnson Williams
International Lottery Board`
  },
  ham: {
    sender: 'sarah.jones@techcorp.com',
    subject: 'Q3 Project Status Update - Team Meeting Thursday',
    body: `Hi everyone,

I wanted to share a quick update on the Q3 project status before our team meeting on Thursday at 2 PM.

The development team has completed the backend API integration, and we're currently in the QA review phase. Please find the detailed report attached to this email.

Agenda for Thursday:
1. Review Q3 milestones
2. Discuss Q4 roadmap
3. Resource allocation

Could everyone please review the attached document before the meeting? If you have any questions or concerns, feel free to reply to this email.

Best regards,
Sarah Jones
Senior Project Manager
TechCorp Solutions`
  }
};

function loadSample(type) {
  document.getElementById('sender').value = samples[type].sender;
  document.getElementById('subject').value = samples[type].subject;
  document.getElementById('emailBody').value = samples[type].body;
}

function clearAll() {
  document.getElementById('sender').value = '';
  document.getElementById('subject').value = '';
  document.getElementById('emailBody').value = '';
  document.getElementById('resultPanel').style.display = 'none';
}

// ─── Core Classifier ───
function analyzeEmail(sender, subject, body) {
  const fullText = `${sender} ${subject} ${body}`.toLowerCase();
  const wordCount = body.split(/\s+/).filter(w => w.length > 0).length;
  const charCount = body.length;

  let spamScore = 0;
  const detectedSignals = [];
  const foundKeywords = [];

  // Check spam keywords
  SPAM_KEYWORDS.forEach(kw => {
    const re = new RegExp(`\\b${kw.replace(/\s+/g, '\\s+')}\\b`, 'i');
    if (re.test(fullText)) {
      spamScore += 2;
      foundKeywords.push({ word: kw.toUpperCase(), type: 'danger' });
    }
  });

  // Check ham keywords
  let hamScore = 0;
  HAM_KEYWORDS.forEach(kw => {
    const re = new RegExp(`\\b${kw.replace(/\s+/g, '\\s+')}\\b`, 'i');
    if (re.test(fullText)) {
      hamScore++;
      foundKeywords.push({ word: kw.toUpperCase(), type: 'safe' });
    }
  });

  // Check patterns
  SPAM_PATTERNS.forEach(p => {
    if (p.regex.test(`${subject} ${body}`)) {
      spamScore += p.weight;
      detectedSignals.push({ word: p.label, type: 'danger' });
    }
  });

  // Suspicious sender domain
  const suspiciousDomains = ['gmail.co', '.net.ru', 'prize', 'lottery', 'free', 'win', 'lucky', 'reward'];
  if (suspiciousDomains.some(d => sender.toLowerCase().includes(d))) {
    spamScore += 4;
    detectedSignals.push({ word: 'SUSPICIOUS DOMAIN', type: 'danger' });
  }

  // Spam score normalization
  spamScore = Math.max(0, spamScore - hamScore * 0.8);
  const maxScore = 30;
  let confidence = Math.min(98, Math.round((spamScore / maxScore) * 100));

  const isSpam = confidence >= 35;
  if (!isSpam) confidence = Math.max(3, Math.round(100 - (spamScore / maxScore) * 100 - Math.random() * 10));

  const allKeywords = [...new Set([...detectedSignals, ...foundKeywords.slice(0, 8)])].slice(0, 12);

  return {
    isSpam,
    confidence,
    wordCount,
    charCount,
    urlCount: (body.match(/https?:\/\//gi) || []).length,
    capsRatio: Math.round(((body.match(/[A-Z]/g) || []).length / Math.max(body.length, 1)) * 100),
    signals: allKeywords,
    spamSignals: detectedSignals.length
  };
}

// ─── Classify ───
function classifyEmail() {

const sender=document.getElementById("sender").value
const subject=document.getElementById("subject").value
const body=document.getElementById("emailBody").value

if(!body && !subject){
alert("Please enter email content")
return
}

const loading=document.getElementById("loading")
loading.classList.add("active")

fetch("/predict",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
sender:sender,
subject:subject,
message:body
})
})
.then(res=>res.json())
.then(data=>{

loading.classList.remove("active")

const panel=document.getElementById("resultPanel")
panel.style.display="block"

if(data.result=="spam"){

panel.className="result-panel spam"

document.getElementById("verdictIcon").textContent="⚠️"
document.getElementById("verdictLabel").textContent="🚨 SPAM DETECTED"
document.getElementById("verdictDesc").textContent="This email looks like spam."

}

else{

panel.className="result-panel ham"

document.getElementById("verdictIcon").textContent="✅"
document.getElementById("verdictLabel").textContent="✓ LEGITIMATE EMAIL"
document.getElementById("verdictDesc").textContent="This email appears safe."

}

})
.catch(error=>{
loading.classList.remove("active")
alert("Server error. Please make sure Flask server is running.")
console.error(error)
})
}

function showResult(result, subject, sender) {
  const panel = document.getElementById('resultPanel');
  panel.className = 'result-panel ' + (result.isSpam ? 'spam' : 'ham');
  panel.style.display = 'block';

  // Verdict
  document.getElementById('verdictIcon').className = 'verdict-icon ' + (result.isSpam ? 'spam-icon' : 'ham-icon');
  document.getElementById('verdictIcon').textContent = result.isSpam ? '⚠️' : '✅';
  document.getElementById('verdictLabel').className = result.isSpam ? 'spam-label' : 'ham-label';
  document.getElementById('verdictLabel').textContent = result.isSpam ? '🚨 SPAM DETECTED' : '✓ LEGITIMATE EMAIL';
  document.getElementById('verdictDesc').textContent = result.isSpam
    ? 'High threat level — This email exhibits multiple spam indicators. Do not click any links.'
    : 'Low threat level — This email appears to be legitimate and safe to interact with.';

  // Confidence
  const confVal = document.getElementById('confValue');
  confVal.className = 'conf-value ' + (result.isSpam ? 'spam' : 'ham');
  confVal.textContent = result.confidence + '%';

  const bar = document.getElementById('confBar');
  bar.className = 'bar-fill ' + (result.isSpam ? 'spam' : 'ham');
  requestAnimationFrame(() => {
    setTimeout(() => { bar.style.width = result.confidence + '%'; }, 50);
  });

  // Features
  document.getElementById('featuresGrid').innerHTML = `
    <div class="feature-card">
      <div class="feature-name">Word Count</div>
      <div class="feature-val">${result.wordCount}</div>
      <div class="feature-sub">Words in body</div>
    </div>
    <div class="feature-card">
      <div class="feature-name">URLs Found</div>
      <div class="feature-val" style="color:${result.urlCount > 0 ? 'var(--neon-red)' : 'var(--neon-green)'}">${result.urlCount}</div>
      <div class="feature-sub">External links</div>
    </div>
    <div class="feature-card">
      <div class="feature-name">Caps Ratio</div>
      <div class="feature-val" style="color:${result.capsRatio > 15 ? 'var(--neon-red)' : 'var(--neon-green)'}">${result.capsRatio}%</div>
      <div class="feature-sub">Uppercase chars</div>
    </div>
    <div class="feature-card">
      <div class="feature-name">Spam Signals</div>
      <div class="feature-val" style="color:${result.spamSignals > 2 ? 'var(--neon-red)' : 'var(--neon-green)'}">${result.spamSignals}</div>
      <div class="feature-sub">Pattern matches</div>
    </div>
  `;

  // Keywords
  const kList = document.getElementById('keywordsList');
  if (result.signals.length > 0) {
    kList.innerHTML = result.signals.map((k, i) =>
      `<span class="kw-tag ${k.type}" style="animation-delay:${i * 0.05}s">${k.word}</span>`
    ).join('');
    document.getElementById('keywordsSection').style.display = 'block';
  } else {
    document.getElementById('keywordsSection').style.display = 'none';
  }

  // Update stats
  stats.scanned++;
  if (result.isSpam) stats.spam++; else stats.ham++;
  document.getElementById('totalScanned').textContent = stats.scanned;
  document.getElementById('spamCount').textContent = stats.spam;
  document.getElementById('hamCount').textContent = stats.ham;
  const acc = stats.scanned > 0 ? Math.round(((stats.ham + stats.spam) / stats.scanned) * 100) + '%' : '—';
  document.getElementById('accuracyVal').textContent = acc;

  // History
  addHistory(subject, result.isSpam, result.confidence);

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function addHistory(subject, isSpam, confidence) {
  history.unshift({ subject, isSpam, confidence, time: new Date().toLocaleTimeString() });

  const list = document.getElementById('historyList');
  document.getElementById('histCount').textContent = history.length + ' RECORDS';

  list.innerHTML = history.map(h => `
    <div class="history-item">
      <span class="history-badge ${h.isSpam ? 'spam' : 'ham'}">${h.isSpam ? 'SPAM' : 'LEGIT'}</span>
      <span class="history-subject">${h.subject || 'No Subject'}</span>
      <span class="history-conf">${h.confidence}% • ${h.time}</span>
    </div>
  `).join('');
}
</script>
</body>
</html>
